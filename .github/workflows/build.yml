name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (e.g. 1.0.0); leave empty to just build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows DLL (Resolume)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target SkilletNTSC SkilletNTSC-Mixer
      - name: Check the export Resolume looks for
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse "$vs\VC\Tools\MSVC" -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          foreach ($dll in @('SkilletNTSC.dll', 'SkilletNTSC-Mixer.dll')) {
            $exports = & $dumpbin.FullName /exports "build\Release\$dll"
            if (-not ($exports -match 'plugMain')) { throw "plugMain is not exported from $dll" }
            $deps = & $dumpbin.FullName /dependents "build\Release\$dll"
            $deps
          }
      - name: Package
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } elseif ('${{ github.event.inputs.release }}' -ne '') { 'v${{ github.event.inputs.release }}' } else { 'dev' }
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item build\Release\SkilletNTSC.dll, build\Release\SkilletNTSC-Mixer.dll, dist\INSTALL.txt, README.md, LICENSE, THIRD_PARTY_NOTICES.md pkg\
          Compress-Archive -Path pkg\* -DestinationPath "SkilletNTSC-$v-windows.zip" -Force
          "ZIP=SkilletNTSC-$v-windows.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish the release (tags, or a manual run with a version)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.release) }}
          target_commitish: ${{ github.sha }}
          name: Skillet NTSC ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.release) }}
          files: ${{ env.ZIP }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: SkilletNTSC-windows-x64
          path: |
            build/Release/SkilletNTSC.dll
            build/Release/SkilletNTSC-Mixer.dll
            dist/INSTALL.txt
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.md

  linux-headless:
    name: Headless render check (Mesa)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Mesa
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri python3-pil glslang-tools
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Check every shader with the reference GLSL compiler
        run: |
          mkdir -p glsl
          ./build/skillet_dump_shaders glsl > shader_list.txt
          fail=0
          while read -r f; do
            if ! glslangValidator --target-env opengl "$f" > out.txt 2>&1; then
              echo "::error::$f"; cat out.txt; fail=1
            fi
          done < shader_list.txt
          exit $fail
      - name: Run the plugin through plugMain
        working-directory: test
        run: |
          python3 make_testcard.py
          ../build/skillet_ffgl_host frames:3 "set:Preset=1" frames:10 shot:vhs.ppm "press:Pad 10" frames:10 shot:spiral.ppm \
            "set:Source A=4" frames:8 shot:tracery.ppm
          ../build/skillet_ffgl_host_mixer frames:2 "set:Source A=7" frames:4 shot:below.ppm
